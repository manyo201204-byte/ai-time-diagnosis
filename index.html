<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIに渡せる仕事、渡せない仕事</title>
<style>
  :root {
    --color-bg: #faf9f6;
    --color-surface: #ffffff;
    --color-text: #1a2b4a;
    --color-text-sub: #5b6b85;
    --color-accent: #2563eb;
    --color-accent-tint: #eaf1fe;
    --color-warn: #b91c1c;
    --color-warn-tint: #fbebe9;
    --color-border: #dfe3ea;
    --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding-top: 6px;
    padding-bottom: 96px;
  }

  .progress-track {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: var(--color-border);
    z-index: 100;
  }

  .progress-fill {
    height: 100%;
    background: var(--color-accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 20px;
  }

  .step-label {
    font-size: 13px;
    color: var(--color-text-sub);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  h1 {
    font-size: 26px;
    line-height: 1.5;
    margin: 0 0 16px;
    color: var(--color-text);
  }

  .audience-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--color-accent);
    letter-spacing: 0.02em;
    margin: 0 0 8px;
  }

  p.pain-point {
    font-size: 14px;
    color: var(--color-text);
    background: var(--color-accent-tint);
    border-left: 3px solid var(--color-accent);
    padding: 12px 14px;
    margin: 0 0 24px;
  }

  h2 {
    font-size: 20px;
    line-height: 1.6;
    margin: 0 0 8px;
    color: var(--color-text);
  }

  p.lead {
    font-size: 15px;
    color: var(--color-text-sub);
    margin: 0 0 28px;
  }

  p.sub {
    font-size: 14px;
    color: var(--color-text-sub);
    margin: 0 0 24px;
  }

  .biz-header {
    position: sticky;
    top: 6px;
    z-index: 50;
    background: var(--color-bg);
    padding: 16px 0 14px;
    margin-bottom: 28px;
    border-bottom: 1.5px solid var(--color-border);
  }

  .biz-header .biz-number {
    font-size: 2rem;
    font-weight: 800;
    color: var(--color-accent);
    line-height: 1;
    margin-bottom: 4px;
  }

  .biz-header .biz-name {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--color-text);
    line-height: 1.35;
  }

  .biz-header .biz-sub {
    font-size: 13px;
    color: var(--color-text-sub);
    margin-top: 8px;
  }

  h2.section-title-lg {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--color-text);
    line-height: 1.35;
  }

  .transition-block {
    border-top: 2px solid var(--color-border);
    padding-top: 28px;
    margin-top: 8px;
  }

  .transition-heading {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--color-text);
    line-height: 1.4;
    margin: 0 0 6px;
  }

  .total-scope-note {
    font-size: 14px;
    font-weight: 700;
    color: var(--color-text-sub);
    margin: 6px 0 0;
  }

  .choice-btn .choice-number {
    flex: 0 0 auto;
    font-weight: 800;
    color: var(--color-accent);
    font-size: 15px;
  }

  .meta {
    font-size: 13px;
    color: var(--color-text-sub);
    margin: 0 0 32px;
    padding: 10px 14px;
    background: var(--color-accent-tint);
    border-radius: 8px;
    display: inline-block;
  }

  .question-block {
    background: var(--color-surface);
    border-radius: 12px;
    padding: 20px 20px 22px;
    margin-bottom: 40px;
  }

  .question-block .q-tag {
    font-size: 12px;
    font-weight: 700;
    color: var(--color-accent);
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .question-block .q-label {
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 16px;
    padding-left: 14px;
    border-left: 3px solid var(--color-accent);
    color: var(--color-text);
  }

  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .choice-btn {
    font-family: inherit;
    font-size: 15px;
    text-align: left;
    padding: 16px 18px;
    border: 1px solid #e9ecf1;
    border-radius: 10px;
    background: var(--color-bg);
    color: var(--color-text);
    cursor: pointer;
    min-height: 52px;
    transition: border-color 0.15s ease, background 0.15s ease;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .choice-btn:hover {
    border-color: var(--color-accent);
  }

  .choice-btn .check {
    width: 18px;
    height: 18px;
    flex: 0 0 18px;
    border: 1.5px solid var(--color-border);
    border-radius: 5px;
    display: inline-block;
    position: relative;
  }

  .choice-btn.multi .check {
    border-radius: 5px;
  }

  .choice-btn.single .check {
    border-radius: 50%;
  }

  .choice-btn.selected {
    border-color: var(--color-accent);
    background: var(--color-accent-tint);
    font-weight: 700;
  }

  .choice-btn.selected .check {
    background: var(--color-accent);
    border-color: var(--color-accent);
  }

  .choice-btn.selected .check::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .nav-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(250, 249, 246, 0.94);
    backdrop-filter: blur(4px);
    border-top: 1px solid var(--color-border);
    padding: 14px 20px;
    z-index: 100;
  }

  .nav-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .btn-back {
    font-family: inherit;
    font-size: 14px;
    color: var(--color-text-sub);
    background: none;
    border: none;
    padding: 10px 6px;
    cursor: pointer;
  }

  .btn-back:hover {
    color: var(--color-text);
    text-decoration: underline;
  }

  .btn-back:disabled {
    visibility: hidden;
  }

  .btn-primary {
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--color-accent);
    border: none;
    border-radius: 10px;
    padding: 14px 28px;
    cursor: pointer;
    min-height: 52px;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .btn-primary:disabled {
    background: #b9c6da;
    cursor: not-allowed;
  }

  .btn-primary.full {
    width: 100%;
  }

  #screen-intro .btn-primary {
    margin-top: 8px;
  }

  pre.debug {
    background: #111827;
    color: #d1fae5;
    padding: 16px;
    border-radius: 8px;
    font-size: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .debug-note {
    font-size: 12px;
    color: var(--color-text-sub);
    margin-bottom: 12px;
  }

  /* ---- Result screen ---- */

  .result-section {
    margin-bottom: 44px;
  }

  .section-num {
    font-size: 12px;
    color: var(--color-text-sub);
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .step-label {
    font-size: 14px;
    font-weight: 800;
    color: var(--color-accent);
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .prompt-card {
    background: var(--color-accent-tint);
    border: 1.5px solid var(--color-accent);
    border-radius: 14px;
    padding: 22px 20px;
  }

  .prompt-card h2 {
    color: var(--color-accent);
  }

  .prompt-sub {
    font-size: 14px;
    color: var(--color-text-sub);
    margin: 0 0 14px;
  }

  .prompt-pair {
    border-left: 3px solid var(--color-accent);
    padding-left: 16px;
  }

  .prompt-substep-label {
    font-size: 14px;
    font-weight: 800;
    color: var(--color-accent);
    margin-bottom: 8px;
  }

  .prompt-connector {
    font-size: 13px;
    color: var(--color-text-sub);
    text-align: center;
    margin: 14px 0;
  }

  .prompt-textarea {
    width: 100%;
    min-height: 260px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--color-border);
    background: #f8f9fb;
    color: var(--color-text);
    resize: vertical;
  }

  .copy-row {
    margin-top: 12px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .copy-feedback {
    font-size: 13px;
    color: var(--color-accent);
    font-weight: 700;
  }

  .process-table-wrap {
    overflow-x: auto;
    background: var(--color-surface);
    border-radius: 10px;
    padding: 4px 4px 0;
  }

  table.process-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  .step1-subheading {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--color-text);
    margin: 22px 0 10px;
  }

  .step1-subheading:first-of-type {
    margin-top: 4px;
  }

  .step1-bridge {
    margin: 4px 0 26px;
  }

  .bridge-list {
    margin: 0;
    padding-left: 20px;
    font-size: 14px;
    line-height: 1.9;
    color: var(--color-text);
  }

  .process-table th {
    text-align: left;
    font-size: 12px;
    color: var(--color-text-sub);
    padding: 8px 10px;
    border-bottom: 1.5px solid var(--color-border);
  }

  .process-table td {
    padding: 14px 10px;
    border-bottom: 1px solid var(--color-border);
    vertical-align: top;
  }

  .process-table tr.row-human {
    background: var(--color-warn-tint);
  }

  .process-table td.col-delegable {
    white-space: nowrap;
  }

  .process-table tr.row-human td.col-delegable {
    color: var(--color-warn);
    font-weight: 700;
  }

  .process-table .caveat {
    margin-top: 8px;
    padding-left: 10px;
    border-left: 2px solid var(--color-border);
    font-size: 12px;
    color: var(--color-text-sub);
    line-height: 1.6;
  }

  .process-table tr.row-human .caveat {
    border-left-color: var(--color-warn);
  }

  @media (max-width: 640px) {
    table.process-table thead { display: none; }
    table.process-table, table.process-table tbody, table.process-table tr, table.process-table td {
      display: block;
      width: 100%;
    }
    table.process-table tr {
      margin-bottom: 14px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 12px 14px;
      background: var(--color-surface);
    }
    table.process-table tr.row-human {
      border-color: var(--color-warn);
    }
    table.process-table td {
      border: none;
      padding: 6px 0;
    }
    table.process-table td::before {
      content: attr(data-label);
      display: block;
      font-size: 11px;
      color: var(--color-text-sub);
      margin-bottom: 2px;
    }
  }

  .calc-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 14px;
    padding: 20px 20px 18px;
  }

  .calc-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 6px 0;
    flex-wrap: wrap;
  }

  .calc-label {
    font-size: 13px;
    color: var(--color-text-sub);
  }

  .calc-value {
    font-weight: 700;
    text-align: right;
  }

  .calc-note {
    font-size: 12px;
    color: var(--color-text-sub);
    margin: 0 0 8px;
  }

  .calc-discount-heading {
    font-size: 13px;
    color: var(--color-text);
    margin: 14px 0 6px;
  }

  .calc-reason-list {
    margin: 0 0 14px;
    padding-left: 20px;
    font-size: 13px;
    color: var(--color-text);
    line-height: 1.8;
  }

  .discount-portion {
    color: var(--color-text-sub);
    font-size: 12px;
    white-space: nowrap;
  }

  .calc-final {
    border-top: 1.5px solid var(--color-border);
    margin-top: 10px;
    padding-top: 12px;
    font-size: 15px;
  }

  .calc-final .calc-value {
    color: var(--color-accent);
    font-size: 20px;
  }

  .calc-footnote {
    font-size: 12px;
    color: var(--color-text-sub);
    margin: 12px 0 0;
  }

  .big-number {
    font-size: 46px;
    font-weight: 800;
    color: var(--color-text);
    line-height: 1.2;
  }

  .big-number .unit {
    font-size: 20px;
    font-weight: 700;
    margin-left: 6px;
    color: var(--color-text-sub);
  }

  .translated-line {
    font-size: 15px;
    color: var(--color-text-sub);
    margin: 10px 0 0;
  }

  .bar-row {
    margin-bottom: 16px;
  }

  .bar-row .bar-label {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    margin-bottom: 5px;
  }

  .bar-track {
    background: var(--color-border);
    border-radius: 6px;
    height: 14px;
    overflow: hidden;
  }

  .bar-fill {
    background: var(--color-accent);
    height: 100%;
    border-radius: 6px;
  }

  .priority-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .priority-list li {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--color-border);
  }

  .priority-rank {
    font-size: 20px;
    font-weight: 800;
    color: var(--color-accent);
    width: 26px;
    flex: 0 0 26px;
  }

  .priority-title {
    font-weight: 700;
    margin-bottom: 3px;
  }

  .priority-meta {
    font-size: 13px;
    color: var(--color-text-sub);
  }

  .step2-card {
    background: var(--color-accent-tint);
    border: 1.5px solid var(--color-accent);
    border-radius: 14px;
    padding: 22px 20px;
  }

  .restart-wrap {
    text-align: center;
    margin-top: 28px;
  }

  .restart-btn {
    font-size: 14px;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

<main class="container" id="screen-root"></main>

<div class="nav-bar" id="nav-bar" style="display:none;">
  <div class="nav-inner">
    <button class="btn-back" id="btn-back">← 戻る</button>
    <button class="btn-primary" id="btn-next">次へ</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var BUSINESSES = [
    { id: "weekly",  label: "部下の週報・日報の取りまとめ（週次）" },
    { id: "meeting", label: "会議資料・議題の作成（週次）" },
    { id: "review",  label: "部下の評価コメント作成（半期）" },
    { id: "ringi",   label: "稟議・申請書の説明文作成（随時）" },
    { id: "numbers", label: "部門数字の説明文作成（月次報告のコメント）" }
  ];

  var COMMON_QUESTIONS = [
    {
      key: "experience",
      label: "生成AIに業務を任せてみた経験は？",
      options: [
        { label: "ない", weight: 0.9 },
        { label: "試したがうまくいかなかった", weight: 0.85 },
        { label: "ある程度使えている", weight: 1.0 }
      ]
    },
    {
      key: "materials",
      label: "選んだ業務で文章を作るとき、材料はどこにありますか？",
      options: [
        { label: "手元にまとまっている", weight: 1.0 },
        { label: "複数の場所に散らばっている", weight: 0.85 },
        { label: "どこにあるか探すところから", weight: 0.7 }
      ]
    },
    {
      key: "editAmount",
      label: "AIが下書きを出してきたとして、あなたはどれくらい手を入れそうですか？",
      options: [
        { label: "ほぼそのまま使えそう", weight: 1.0 },
        { label: "半分くらいは書き直しそう", weight: 0.9 },
        { label: "結局ほとんど自分で書き直しそう", weight: 0.8 }
      ]
    }
  ];

  var BIZ_QUESTIONS = {
    weekly: [
      { key: "hours", label: "週あたりの所要時間は？", options: ["1時間未満", "1〜3時間", "3時間以上"] },
      {
        key: "trust",
        label: "部下の報告に書かれた「順調」「問題なし」を、そのまま受け取れますか？",
        options: [
          { label: "そのままは受け取れない", weight: 0.8 },
          { label: "人によっては注意して読む", weight: 0.9 },
          { label: "だいたいそのまま受け取れる", weight: 1.0 }
        ]
      },
      {
        key: "confirm",
        label: "まとめた後、内容を部下に確認してから上に出すことはありますか？",
        options: [
          { label: "よくある", weight: 0.8 },
          { label: "たまにある", weight: 0.9 },
          { label: "ほとんどない", weight: 1.0 }
        ]
      }
    ],
    meeting: [
      { key: "hours", label: "週あたりの所要時間は？", options: ["1時間未満", "1〜2時間", "2時間以上"] },
      {
        key: "collect",
        label: "資料を作る前に、各所から数字や進捗を集める手間はどれくらいですか？",
        options: [
          { label: "あちこち探し回る", weight: 0.8 },
          { label: "だいたい決まった場所にある", weight: 0.9 },
          { label: "ほぼ揃っている", weight: 1.0 }
        ]
      }
    ],
    review: [
      { key: "hours", label: "半期あたりの所要時間は？", options: ["3時間未満", "3〜6時間", "6時間以上"] },
      {
        key: "materials",
        label: "半期分の材料（週報・1on1メモなど）は残っていますか？",
        options: [
          { label: "ほぼ残っていない", weight: 0.8 },
          { label: "一部しかない", weight: 0.9 },
          { label: "探せば出てくる", weight: 1.0 }
        ]
      }
    ],
    ringi: [
      { key: "hours",     label: "1回あたりの所要時間は？", options: ["30分未満", "30分〜1時間", "1時間以上"] },
      { key: "frequency", label: "月にどれくらい発生しますか？", options: ["月1件程度", "月2〜4件", "月5件以上"] }
    ],
    numbers: [
      { key: "hours", label: "月あたりの所要時間は？", options: ["1時間未満", "1〜2時間", "2時間以上"] },
      {
        key: "fieldReliance",
        label: "数字の変動理由は、現場に聞かないと分からないことが多いですか？",
        options: [
          { label: "ほぼ毎回", weight: 0.8 },
          { label: "半々", weight: 0.9 },
          { label: "だいたい自分で分かる", weight: 1.0 }
        ]
      }
    ]
  };

  // ---- Process-breakdown / prompt content per business ----
  // weight = share of that business's current time (sums to 100 per business)
  // delegable = whether AI can take this step
  // reason / caveat may be plain strings or functions of state for light personalization
  var BUSINESS_DATA = {
    weekly: {
      commitRatio: 0.55,
      ease: 1.0,
      hoursMap: { "1時間未満": 0.5, "1〜3時間": 2, "3時間以上": 4 },
      steps: [
        {
          text: "部下から届いた報告を読む",
          weight: 15, delegable: true,
          reason: "読む・整理するだけの作業で、判断は伴わない"
        },
        {
          text: "各人から要点を抜き出す",
          weight: 15, delegable: true,
          reason: "書かれている内容から要点を拾うだけの整形作業"
        },
        {
          text: "個人ごとの「基準の揺らぎ」を補正する",
          weight: 25, delegable: false,
          reason: "部下が同じ「順調です」と書いても、控えめに書く人と盛る人がいる。Aさんの順調とBさんの順調は違う。この補正には各部下の過去の書きぶりとの比較が必要だが、その比較対象は渡したテキストの中に存在しない。"
        },
        {

    if (bizId === "review") return raw / 26;   // half-year total -> weekly
    if (bizId === "numbers") return raw / 4.3; // monthly total -> weekly
    if (bizId === "ringi") return (raw * getRingiMonthlyCount(s)) / 4.3; // per-occurrence x monthly count -> weekly

  // reduction rather than letting each business round independently.
  function allocateWeeklyMinutes(chosen, reductions) {
    var totalRaw = chosen.reduce(function (sum, id) { return sum + reductions[id]; }, 0);
    var totalMin = roundToNearestFiveMinutes(totalRaw);
    var minutes = {};

    if (chosen.length === 0 || totalRaw <= 0) {
      chosen.forEach(function (id) { minutes[id] = 0; });
      return { totalMin: totalMin, minutes: minutes };
    }

    var sumRounded = 0;
    chosen.forEach(function (id) {
      var share = (reductions[id] / totalRaw) * totalMin;
      var rounded = Math.round(share / 5) * 5;
      minutes[id] = rounded;
      sumRounded += rounded;
    });

    // Route any rounding leftover onto the single largest-reduction business,
    // so the breakdown always sums to exactly totalMin. When totalMin itself
    // is only a handful of minutes and several businesses are selected, this
    // can leave a smaller business at 0 for that business alone — an exact
    // sum is kept as the higher priority over never showing 0 in that
    // unavoidable edge case.
    var diff = totalMin - sumRounded;
    if (diff !== 0) {
      var maxId = chosen.slice().sort(function (a, b) { return reductions[b] - reductions[a]; })[0];
      minutes[maxId] += diff;
      if (minutes[maxId] < 0) minutes[maxId] = 0;
    }

    return { totalMin: totalMin, minutes: minutes };
  }

  // For sporadic (non-weekly-native) businesses, converts a weekly-equivalent
  // hours figure back to "per occurrence" hours. Returns null for weekly/meeting,
  // which have no separate occurrence unit.
  function perOccurrenceHoursFor(bizId, weeklyHours, s) {
    if (bizId === "review") return weeklyHours * 26;
    if (bizId === "numbers") return weeklyHours * 4.3;
    if (bizId === "ringi") return (weeklyHours * 4.3) / getRingiMonthlyCount(s);
    return null;
  }

  // positive time; falls back to "5分未満" so the exact-sum allocation never
  // reads as "no benefit here".
  function weeklyMinutesLabel(mins) {
    return mins > 0 ? minutesToHM(mins) : "5分未満";
  }

  function fallbackCopy(text, cb) {
    try {
      var ta = document.createElement("textarea");

      ta.style.opacity = "0";

      ta.focus();

  function el(tag, attrs, children) {

      else if (k === "text") node.textContent = attrs[k];

  function renderCalcSection(topId, allocatedMinutes) {
    var data = BUSINESS_DATA[topId];
    var s = state;
    var selectedHoursLabel = s.biz[topId].hours;
    var rawValue = data.hoursMap[selectedHoursLabel];

    var cadenceUnit, weeklyBase, conversionReason;
    if (topId === "review") {
      cadenceUnit = "半期";
      weeklyBase = rawValue / 26;
      conversionReason = "半期に一度のため";
    } else if (topId === "numbers") {
      cadenceUnit = "月";
      weeklyBase = rawValue / 4.3;
      conversionReason = "月次の業務のため";
    } else if (topId === "ringi") {
      var ringiCount = getRingiMonthlyCount(s);
      cadenceUnit = "1回あたり";
      weeklyBase = (rawValue * ringiCount) / 4.3;
      conversionReason = "随時発生する業務のため（" + s.biz.ringi.frequency + "として計算）";
    } else {
      cadenceUnit = "週";
      weeklyBase = rawValue;
      conversionReason = null;
    }

    var delegableWeight = data.steps.reduce(function (sum, st) {
      return sum + (st.delegable ? st.weight : 0);
    }, 0);
    var afterCommit = weeklyBase * (delegableWeight / 100);

    var materialsVal = s.common.materials;
    var editVal = s.common.editAmount;
    var expVal = s.common.experience;

    var reasons = [];
    [
      { key: "materials", val: materialsVal },
      { key: "editAmount", val: editVal },
      { key: "experience", val: expVal }
    ].forEach(function (item) {
      var w = getCommonWeight(item.key, item.val);
      var portion = discountPortionLabel(w);
      if (portion) {
        var text = (DISCOUNT_REASON_TEXT[item.key] && DISCOUNT_REASON_TEXT[item.key][item.val]) || item.val;
        reasons.push({ text: text, portion: portion });
      }
    });

    BIZ_QUESTIONS[topId].forEach(function (q) {
      if (STRUCTURAL_BIZ_QUESTION_KEYS[q.key]) return;
      var val = s.biz[topId][q.key];
      var w = getBizQuestionWeight(topId, q.key, val);
      var portion = discountPortionLabel(w);
      if (portion) {
        var lookup = BIZ_DISCOUNT_REASON_TEXT[topId] && BIZ_DISCOUNT_REASON_TEXT[topId][q.key];
        var text = (lookup && lookup[val]) || val;
        reasons.push({ text: text, portion: portion });
      }
    });

    var section = el("div", { class: "result-section calc-card" });
    section.appendChild(el("div", { class: "section-num", text: "根拠" }));
    section.appendChild(el("h2", { text: "この時間はこう計算しています" }));

    var row1 = el("div", { class: "calc-row" });
    row1.appendChild(el("span", { class: "calc-label", text: "現在かけている時間" }));
    row1.appendChild(el("span", {
      class: "calc-value",
      text: cadenceUnit + selectedHoursLabel + "（あなたの回答）／ " + formatDurationHM(rawValue) + "として計算"
    }));
    section.appendChild(row1);
    if (conversionReason) {
      section.appendChild(el("div", {
        class: "calc-note",
        text: "※この業務は" + conversionReason + "、以降は週あたりに換算した数字で表示します（週" + formatDurationHM(weeklyBase) + "）"
      }));
    }

    var row2 = el("div", { class: "calc-row" });
    row2.appendChild(el("span", { class: "calc-label", text: "うちAIに渡せる工程の比重" }));
    row2.appendChild(el("span", { class: "calc-value", text: delegableWeight + "%（上の表の「渡せる」工程の比重合計）" }));
    section.appendChild(row2);
    section.appendChild(el("div", { class: "calc-note", text: "→ " + formatDurationHM(afterCommit) }));

    if (reasons.length > 0) {
      section.appendChild(el("p", {
        class: "calc-discount-heading",
        text: "ここから、以下の事情を踏まえて差し引いています："

    var finalRow = el("div", { class: "calc-row calc-final" });
    finalRow.appendChild(el("span", {
      class: "calc-label",
      text: "この業務（" + BIZ_TAG_LABELS[topId] + "）の削減見込み"

    big.appendChild(el("span", { class: "unit", text: " / 週" }));
    section.appendChild(big);
    section.appendChild(el("p", {
      class: "total-scope-note",
      text: "選んだ" + chosenCount + "業務の合計"
    }));

    var isSporadic = topId === "review" || topId === "numbers" || topId === "ringi";

    if (isSporadic) {
      var bizWeeklyMinutes = allocation.minutes[topId];
      var bizWeeklyHours = bizWeeklyMinutes / 60;
      var perOcc;
      if (topId === "review") perOcc = bizWeeklyHours * 26;
      else if (topId === "numbers") perOcc = bizWeeklyHours * 4.3;
      else perOcc = (bizWeeklyHours * 4.3) / getRingiMonthlyCount(state);

      var bizLabel = BUSINESSES.filter(function (b) { return b.id === topId; })[0].label;
      var occNoun = OCCURRENCE_NOUN[topId];
      section.appendChild(el("p", {
        class: "translated-line",
        text: bizLabel + "は1" + occNoun + "あたり 約" + formatDurationHM(perOcc) + "の削減見込み ／ 週あたりに直すと約" + minutesToHM(bizWeeklyMinutes) + "（毎週の業務ではないため、週で割ると数字が小さく見えます）。"
      }));
    }

    var days = Math.round((total / 2) * 2) / 2; // 2h ≈ 1 evening of overtime, rounded to nearest 0.5
    var dayText;
    if (days >= 0.5) {
      dayText = "定時後の作業が、週" + days + "日ぶん減る計算です。";
    } else if (chosenCount === 1) {
      dayText = "この業務については、上の工程分解とプロンプトから始めてください。他の業務も気になる場合は、やり直して複数選ぶと優先順位が出ます。";
    } else if (isSporadic) {
      dayText = "毎週の業務ではないため週あたりでは小さく見えますが、1" + OCCURRENCE_NOUN[topId] + "ごとの負担は確実に減ります。";
    } else {
      dayText = "今回の回答では、はっきり数字に出るほどの削減にはなりませんでした。まずは最優先の1業務からで十分です。";
    }
    section.appendChild(el("p", { class: "translated-line", text: dayText }));
    return section;
  }

  function renderBreakdownSection(chosen, reductions, allocatedMinutes) {
    var section = el("div", { class: "result-section" });
    section.appendChild(el("div", { class: "section-num", text: "内訳" }));
    section.appendChild(el("h2", { text: "選んだ業務ごとの内訳" }));

    var max = Math.max.apply(null, chosen.map(function (id) { return reductions[id]; }).concat([0.01]));
    chosen.forEach(function (id) {
      var label = BUSINESSES.filter(function (b) { return b.id === id; })[0].label;
      var val = reductions[id];
      var pct = Math.max(4, Math.round((val / max) * 100));

      var mins = allocatedMinutes[id];
      var valueText = weeklyMinutesLabel(mins) + "/週";
      if (mins <= 0) {
        var perOcc = perOccurrenceHoursFor(id, val, state);
        if (perOcc != null) {
          valueText += "（1回あたり約" + formatDurationHM(perOcc) + "）";
        }
      }

      var row = el("div", { class: "bar-row" });
      var labelRow = el("div", { class: "bar-label" });
      labelRow.appendChild(el("span", { text: label }));
      labelRow.appendChild(el("span", { text: valueText }));
      row.appendChild(labelRow);

      var track = el("div", { class: "bar-track" });
      var fill = el("div", { class: "bar-fill" });
      fill.style.width = pct + "%";
      track.appendChild(fill);
      row.appendChild(track);

      section.appendChild(row);
    });
    return section;
  }

  function renderPrioritySection(order, allocatedMinutes) {
    var section = el("div", { class: "result-section" });
    section.appendChild(el("div", { class: "section-num", text: "優先順位" }));
    section.appendChild(el("h2", { text: "手をつける優先順位" }));
    section.appendChild(el("p", { class: "sub", text: "削減できる時間の大きさだけでなく、着手しやすさも踏まえた順番です。" }));

    var list = el("ol", { class: "priority-list" });
    order.forEach(function (id, i) {
      var label = BUSINESSES.filter(function (b) { return b.id === id; })[0].label;
      var li = el("li", {});
      li.appendChild(el("div", { class: "priority-rank", text: String(i + 1) }));
      var body = el("div", { class: "priority-body" });
      body.appendChild(el("div", { class: "priority-title", text: label }));
      body.appendChild(el("div", {
        class: "priority-meta",
        text: weeklyMinutesLabel(allocatedMinutes[id]) + "/週の削減見込み ・ " + EASE_COMMENTS[id]
      }));
      li.appendChild(body);
      list.appendChild(li);
    });
    section.appendChild(list);
    return section;
  }

  function renderStep2Section() {
    var section = el("div", { class: "result-section step2-card" });
    section.appendChild(el("div", { class: "step-label", text: "STEP 2 / 2" }));
    section.appendChild(el("h2", { text: "来月、部下に渡せること" }));
    section.appendChild(el("p", {
      class: "prompt-sub",
      text: "STEP 1で「自分では削れない」とした工程は、部下側を変えることで縮められます。"
    }));
    section.appendChild(el("p", {
      class: "sub",
      text: "これは、部下自身が手元のAI（Copilot、ChatGPTなど）に貼り付けて、自分の週報を書くためのプロンプトです。書き方を指示する文書ではなく、書いた週報をAIに添削させるものでもありません。「こう書きなさい」という指示だと部下の仕事が増えるだけで続きませんが、AIに書かせる道具として渡せば部下自身も楽になるため定着し、結果として提出される週報の粒度が揃い、あなた側の「基準の揺らぎを補正する」工程が縮んでいきます。定着には数週間かかるため、上の削減時間には含めていません。ここは定着後にさらに減る分です。"
    }));
    section.appendChild(el("p", {
      class: "sub",
      text: "使い方：以下のプロンプトを部下に送ってください。部下が手元のAIに貼り付けて使うと、週報の下書きが出てきます。"
    }));

    var coverLabel = el("div", { class: "q-label", text: "部下に送る一言（Slack・メール用）" });
    section.appendChild(coverLabel);
    section.appendChild(renderPromptBlock(STEP2_COVER_MESSAGE, "添え文をコピー"));

    var promptLabel = el("div", { class: "q-label", text: "部下が使うプロンプト" });
    section.appendChild(promptLabel);
    section.appendChild(renderPromptBlock(STEP2_PROMPT, "部下に送るプロンプトをコピー"));

    return section;
  }

  function renderResult() {
    var root = el("div", { id: "screen-result" });

    var chosen = BUSINESSES
      .filter(function (b) { return state.businesses.indexOf(b.id) !== -1; })
      .map(function (b) { return b.id; });

    var reductions = {};
    chosen.forEach(function (id) { reductions[id] = weeklyReduction(id, state); });

    var scores = {};
    chosen.forEach(function (id) { scores[id] = reductions[id] * BUSINESS_DATA[id].ease; });

    var priorityOrder = chosen.slice().sort(function (a, b) { return scores[b] - scores[a]; });
    var topId = priorityOrder[0];
    var totalReduction = chosen.reduce(function (sum, id) { return sum + reductions[id]; }, 0);

    var showStep2 = topId === "weekly" &&
      (state.common.materials === "複数の場所に散らばっている" || state.common.materials === "どこにあるか探すところから");

    var allocation = allocateWeeklyMinutes(chosen, reductions);

    root.appendChild(renderStep1Section(topId, showStep2));
    root.appendChild(renderCalcSection(topId, allocation.minutes[topId]));
    root.appendChild(renderTotalSection(totalReduction, allocation, topId, chosen.length));
    root.appendChild(renderBreakdownSection(chosen, reductions, allocation.minutes));
    root.appendChild(renderPrioritySection(priorityOrder, allocation.minutes));

    if (showStep2) {
      root.appendChild(renderStep2Section());
    }

    var restartWrap = el("div", { class: "restart-wrap" });
    var restartBtn = el("button", { type: "button", class: "btn-back restart-btn", text: "最初からやり直す" });
    restartBtn.addEventListener("click", function () { location.reload(); });
    restartWrap.appendChild(restartBtn);
    root.appendChild(restartWrap);

    return root;
  }

  function renderScreenContent(screenId) {
    if (screenId === "intro") return renderIntro();
    if (screenId === "business-select") return renderBusinessSelect();
    if (screenId === "common") return renderCommon();
    if (screenId === "result") return renderResult();
    if (screenId.indexOf("biz-") === 0) return renderBizScreen(screenId.slice(4));
    return el("div", {});
  }

  function updateProgress() {
    var flow = getFlow();
    var idx = flow.indexOf(currentScreenId);
    var pct = flow.length > 1 ? Math.round((idx / (flow.length - 1)) * 100) : 0;
    document.getElementById("progress-fill").style.width = pct + "%";
  }

  function updateNavBar() {
    var navBar = document.getElementById("nav-bar");
    var backBtn = document.getElementById("btn-back");
    var nextBtn = document.getElementById("btn-next");

    if (currentScreenId === "intro") {
      navBar.style.display = "none";
      return;
    }
    navBar.style.display = "block";

    var flow = getFlow();
    var idx = flow.indexOf(currentScreenId);
    backBtn.disabled = idx <= 0;

    if (currentScreenId === "result") {
      nextBtn.style.display = "none";
    } else {
      nextBtn.style.display = "inline-block";
      nextBtn.disabled = !isScreenValid(currentScreenId);
      nextBtn.textContent = "次へ";
    }
  }

  function render() {
    var root = document.getElementById("screen-root");
    root.innerHTML = "";
    root.appendChild(renderScreenContent(currentScreenId));
    updateProgress();
    updateNavBar();
  }

  document.getElementById("btn-back").addEventListener("click", goBack);
  document.getElementById("btn-next").addEventListener("click", function () {
    if (isScreenValid(currentScreenId)) goNext();
  });

  render();
})();
</script>

</body>
</html>
